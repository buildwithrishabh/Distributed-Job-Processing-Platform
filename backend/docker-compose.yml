services:

  # Service 3: API Express Server
  api:
    build:
      context: .   
      dockerfile: Dockerfile
    container_name: job_platform_api
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - NODE_ENV=production
    networks:
      - job-network

  # Service 4: Background Workers (Scalable)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: node src/worker.js
    deploy:
      replicas: 3 
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - job-network

  # Service 5: Prometheus Server
  prometheus:
    image: prom/prometheus:latest
    container_name: job_platform_prometheus
    restart: unless-stopped
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - job-network
    depends_on:
      - api

  # Service 6: Grafana (Auto-provisioned with Datasource and Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: job_platform_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - job-network
    depends_on:
      - prometheus

networks:
  job-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
