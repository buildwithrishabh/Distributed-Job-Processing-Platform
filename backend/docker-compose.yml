services:

  # Service 3: API Express Server
  api:
    build:
      context: .   
      dockerfile: Dockerfile
    container_name: job_platform_api
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - NODE_ENV=production
    networks:
      - job-network

  # Service 4: Background Workers (Scalable)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: node src/worker.js
    deploy:
      replicas: 3 
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - job-network

networks:
  job-network:
    driver: bridge
