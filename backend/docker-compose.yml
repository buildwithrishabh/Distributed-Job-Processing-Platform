version: '3.8'

services:
  # Service 1: MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: job_platform_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - job-network

  # Service 2: Redis In-Memory Queue Store
  redis:
    image: redis:7.2-alpine
    container_name: job_platform_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - job-network

  # Service 3: API Express Server
  api:
    build:
      context: .   
      dockerfile: Dockerfile
    container_name: job_platform_api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/job_platform
      - MONGODB_URI=mongodb://mongodb:27017/job_platform
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mongodb
      - redis
    networks:
      - job-network

  # Service 4: Background Workers (Scalable)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: node src/worker.js
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/job_platform
      - MONGODB_URI=mongodb://mongodb:27017/job_platform
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_CONCURRENCY=5
      - CONCURRENCY=5
    depends_on:
      - mongodb
      - redis
    networks:
      - job-network

networks:
  job-network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
